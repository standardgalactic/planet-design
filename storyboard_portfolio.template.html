<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planet · Storyboard Portfolio</title>
<style>
:root{color-scheme:dark;--bg:#101316;--card:#1a1f23;--line:#343d42;--muted:#a5b1b7;--gold:#dbc38c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef0ef;font:16px/1.5 system-ui,sans-serif}header{padding:30px 4vw 20px;border-bottom:1px solid var(--line)}h1{font-size:clamp(25px,4vw,42px);font-weight:500;margin:0}header p{color:var(--muted);margin:6px 0}nav{position:sticky;top:0;z-index:2;background:#101316f5;padding:14px 4vw;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}input,select,button,a.button{font:inherit;background:#21282d;color:inherit;border:1px solid #46535a;border-radius:6px;padding:8px 12px}input{flex:1;min-width:160px}button,a{cursor:pointer}button:hover,a:hover{color:var(--gold)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}main{padding:20px 4vw 60px}.film{margin:20px 0 45px}.film h2{font-weight:500;margin-bottom:4px}.film>p{color:var(--muted);max-width:900px}.scene{margin:24px 0}.scene h3{font-weight:500;font-size:17px;color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--tile,250px)),1fr));gap:14px}.card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}.imagebutton{display:block;width:100%;padding:0;border:0;border-radius:0;background:#090c0e}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.caption{padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:13px;overflow-wrap:anywhere}.star{padding:0 8px;font-size:20px;border:0;background:none;color:var(--muted)}.star[aria-pressed=true]{color:var(--gold)}.empty{padding:40px;color:var(--muted)}dialog{width:96vw;max-width:1500px;max-height:94vh;padding:0;background:#141a1e;color:#eee;border:1px solid #53616a;border-radius:10px}dialog::backdrop{background:#000c}.toolbar{display:flex;gap:8px;padding:12px;align-items:center;flex-wrap:wrap}.toolbar span{flex:1}.viewer{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}#large{width:100%;height:72vh;object-fit:contain;background:#080a0b}.details{padding:10px 22px;overflow:auto;max-height:72vh;white-space:pre-wrap;overflow-wrap:anywhere}.details h2{font-size:22px}.details h3{font-size:14px;color:var(--gold);margin-bottom:3px}.details p{margin-top:3px;color:#c7d0d5}details{margin:12px 0}summary{cursor:pointer;color:var(--gold)}.screenplay{white-space:pre-wrap;color:#bcc6ca;max-height:400px;overflow:auto;padding:12px;border:1px solid var(--line)}a{color:var(--gold)}@media(max-width:760px){.viewer{display:block}#large{height:48vh}.details{max-height:none}dialog{max-height:95vh;overflow:auto}nav{position:static}}
</style>
<header><h1>Planet / Storyboard Portfolio</h1><p>Screenplays, scenes, and visual variations</p><p id="count" role="status"></p></header>
<nav aria-label="Portfolio filters"><input id="search" type="search" placeholder="Search title, location, action, prompt…" aria-label="Search images"><select id="film" aria-label="Screenplay"><option value="">All screenplays</option></select><select id="scene" aria-label="Scene"><option value="">All scenes</option></select><button id="favorites" aria-pressed="false">★ Favourites</button><select id="size" aria-label="Thumbnail size"><option value="250">Medium thumbnails</option><option value="160">Small thumbnails</option><option value="380">Large thumbnails</option></select><button id="export">Export favourites</button></nav>
<main id="gallery"></main>
<dialog id="modal" aria-label="Full-size image viewer"><div class="toolbar"><button id="prev" aria-label="Previous image">← Previous</button><button id="next" aria-label="Next image">Next →</button><span id="position"></span><a id="original" target="_blank" rel="noopener">Open original</a><button id="pick">☆ Favourite</button><button id="close">Close ✕</button></div><div class="viewer"><img id="large" alt=""><div class="details" id="details"></div></div></dialog>
<script>
'use strict';
const DATA=/*PORTFOLIO_DATA*/[];
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
let saved=[];try{saved=JSON.parse(localStorage.getItem('planet-storyboard-favourites-v1')||'[]')}catch(e){}let stars=new Set(Array.isArray(saved)?saved.filter(x=>typeof x==='string'):[]),onlyStars=false,visible=[],current=-1;
const films=new Map(DATA.map(r=>[r.film,r.title]));for(const [key,title] of films){const o=el('option',title);o.value=key;$('film').append(o)}
for(const n of [...new Set(DATA.map(r=>r.scene))].sort((a,b)=>a-b)){const o=el('option',n?'Scene '+n:'Unnumbered');o.value=String(n);$('scene').append(o)}
function persist(){try{localStorage.setItem('planet-storyboard-favourites-v1',JSON.stringify([...stars]))}catch(e){$('count').textContent+=' · Favourites are temporary in this browser; export them to keep them.'}}
function toggle(id){stars.has(id)?stars.delete(id):stars.add(id);render();persist();if($('modal').open){if(visible.length)show(Math.min(current,visible.length-1));else $('modal').close()}}
function render(){const query=$('search').value.trim().toLowerCase();visible=DATA.filter(r=>(!$('film').value||r.film===$('film').value)&&(!$('scene').value||r.scene===Number($('scene').value))&&(!onlyStars||stars.has(r.id))&&(!query||[r.title,r.film,r.location,r.action,r.prompt,r.filename].join(' ').toLowerCase().includes(query)));$('count').textContent=visible.length+' / '+DATA.length+' images · '+new Set(visible.map(r=>r.film)).size+' screenplays · '+stars.size+' favourites';const root=$('gallery');root.replaceChildren();if(!visible.length){root.append(el('p','No images match these filters. Rebuild this file to include newly rendered images.','empty'));return}let section,grid,lastFilm,lastScene;visible.forEach((r,index)=>{if(lastFilm!==r.film){section=el('section',undefined,'film');section.append(el('h2',r.title));if(r.logline)section.append(el('p',r.logline));if(r.screenplay){const d=el('details');d.append(el('summary','Read screenplay'),el('div',r.screenplay,'screenplay'));section.append(d)}root.append(section);lastFilm=r.film;lastScene=null}if(lastScene!==r.scene){const s=el('section',undefined,'scene');s.append(el('h3',(r.scene?'Scene '+String(r.scene).padStart(2,'0'):'Unnumbered')+(r.location?' / '+r.location:'')));grid=el('div',undefined,'grid');s.append(grid);section.append(s);lastScene=r.scene}const card=el('figure',undefined,'card'),button=el('button',undefined,'imagebutton'),img=el('img');img.src=r.url;img.alt=(r.location||r.title)+' · '+r.filename;img.loading='lazy';img.decoding='async';img.addEventListener('error',()=>{img.alt='Image unavailable: '+r.filename});button.append(img);button.setAttribute('aria-label','Inspect '+img.alt);button.onclick=()=>{show(index);$('modal').showModal()};const caption=el('figcaption',undefined,'caption'),star=el('button',stars.has(r.id)?'★':'☆','star');star.setAttribute('aria-label','Favourite '+r.filename);star.setAttribute('aria-pressed',String(stars.has(r.id)));star.onclick=()=>toggle(r.id);caption.append(el('span',r.filename),star);card.append(button,caption);grid.append(card)})}
function show(i){if(!visible.length)return;current=(i+visible.length)%visible.length;const r=visible[current];$('large').src=r.url;$('large').alt=r.location||r.title;$('position').textContent=(current+1)+' / '+visible.length;$('original').href=r.url;$('pick').textContent=stars.has(r.id)?'★ Favourite':'☆ Favourite';$('pick').setAttribute('aria-pressed',String(stars.has(r.id)));const d=$('details');d.replaceChildren(el('h2',r.title));for(const [name,value] of [['Scene',r.scene+' · '+r.location],['Action',r.action],['Camera',r.camera],['Editing duration',r.duration?r.duration+' seconds':''],['Prompt',r.prompt],['Shared style',r.style],['Negative prompt',r.negative],['File',r.id]])if(value)d.append(el('h3',name),el('p',String(value)))}
$('search').oninput=render;$('film').onchange=render;$('scene').onchange=render;$('size').onchange=()=>document.documentElement.style.setProperty('--tile',$('size').value+'px');$('favorites').onclick=()=>{onlyStars=!onlyStars;$('favorites').setAttribute('aria-pressed',String(onlyStars));render()};$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('pick').onclick=()=>{if(visible[current])toggle(visible[current].id)};$('close').onclick=()=>$('modal').close();document.addEventListener('keydown',e=>{if(!$('modal').open)return;if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});$('export').onclick=()=>{const blob=new Blob([JSON.stringify(DATA.filter(r=>stars.has(r.id)),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='storyboard-favourites.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
