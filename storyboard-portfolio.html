d Sentinel", "logline": "An observatory technician uncovers a stranded maintenance vessel after noticing an unusual light moving outside the submerged window, leading to its rescue.", "screenplay": "\nINT. OBSERVATORY - NIGHT\n\nA lone TECHNICIAN (late 20s, glasses, uniform) stands by a large SUBMERGED WINDOW overlooking a vast oceanic expanse beneath the observatory. The room is dimly lit with warm amber lights from old fluorescent tubes. The technician fiddles with a small handheld scanner, occasionally glancing at the moving light outside.\n\n1. Establishing View - Duration: 15 seconds\n   Action: Wide shot of the observatory interior and the endless blue expanse beyond the window. The technician is visible in silhouette against the glow of the scanner.\n   Camera: Static crane shot.\n   Visual Prompt: Silhouette of TECHNICIAN holding a handheld scanner, with the glowing light outside the glass reflecting on the concrete walls.\n\nINT. OBSERVATORY - NIGHT (CONT'D)\n\nThe technician finally identifies the pattern of the moving light as consistent and deliberate, indicating movement beyond the window.\n\n2. Medium Composition - Duration: 15 seconds\n   Action: Close-up on the technician's face, eyes wide with curiosity, hands steady as they adjust the scanner to follow the light's path.\n   Camera: Handheld shot from above, focusing on TECHNICIAN's expression and movements.\n   Visual Prompt: Technician's focused face illuminated by scanner glow, hands moving in rhythm with the movement of the light outside.\n\nINT. OBSERVATORY - NIGHT (CONT'D)\n\nRealizing the potential for a stranded vessel, the technician decides to investigate further despite the risks.\n\n3. Discovery - Duration: 15 seconds\n   Action: Medium shot showing the technician leaving their station and walking towards the window with the scanner in hand.\n   Camera: Tracking shot following TECHNICIAN's movement toward the window.\n   Visual Prompt: Technician moving through shadowed corridors, light
